name: Platform API CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'platform-api/**'

env:
  IMAGE_NAME: platform-api
  AWS_REGION: us-east-1

jobs:
  build-test-deploy:
    runs-on: platform-runner
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./platform-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=AdhamAyad_KubeVision-Serverless-Platform
            # -Dsonar.qualitygate.wait=true

      - name: Build Docker Image
        run: docker build -t ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0 # Don't fail the build on vulnerabilities, but log them 
          severity: CRITICAL,HIGH

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}

      - name: Push Image to Amazon ECR
        run: docker push ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update ArgoCD Manifests
        working-directory: .
        run: |       
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git clean-repo
          cd clean-repo
          sed -i "s|image: .*|image: ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" Kubernetes/api/platform-api-deployment.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Kubernetes/api/platform-api-deployment.yaml
          git commit -m "Auto update image tag to ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          git push origin main