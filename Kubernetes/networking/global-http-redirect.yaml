apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: force-https-redirect
  namespace: kubevision-ingress
spec:
  parentRefs:
  - name: kubevision-gateway
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        port: 443
        statusCode: 301