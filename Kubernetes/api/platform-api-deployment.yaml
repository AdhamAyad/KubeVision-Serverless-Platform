apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app: platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      serviceAccountName: api-sa
      containers:
        - name: platform-api
          image: dummy-image:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 8080 
              name: http