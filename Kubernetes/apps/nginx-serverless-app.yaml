apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-serverless-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8" 
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
  - group: serving.knative.dev
    kind: Service
    jsonPointers:
    - /metadata/annotations/serving.knative.dev~1routes
    - /metadata/annotations/serving.knative.dev~1routingStateModified
    - /status
    - /spec/traffic
  project: default
  source:
    repoURL: 'https://github.com/AdhamAyad/KubeVision-Serverless-Platform.git'
    targetRevision: main
    path: Kubernetes/workloads/nginx-serverless
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true